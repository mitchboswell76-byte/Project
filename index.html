<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Title, description, social-card and structured-data tags are injected
         at build time from src/content.js by the seo() plugin in
         vite.config.js, so there is one source for the site's words. -->
    <!--seo-->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- The first thing in the tab order: a way past the gate and the world
         straight to the text. Visible only when focused (see style.css). -->
    <a id="skip-link" class="skip-link" href="#doc"></a>

    <!-- ============================================================
         ENTRY GATE — painted before the world exists
         ============================================================ -->
    <div id="entry" class="entry">
      <canvas id="entry-canvas" aria-hidden="true"></canvas>

      <div class="entry__corner entry__corner--bl">
        <p id="entry-name-lines" class="entry__name"></p>
        <p id="entry-since" class="entry__since"></p>
        <p id="entry-tagline" class="entry__tagline"></p>
      </div>

      <div class="entry__corner entry__corner--br">
        <button id="enter-button" class="enter" type="button" aria-label="Enter the site">
          <span id="enter-label">Enter</span>
          <span class="enter__arrow" aria-hidden="true">&rarr;</span>
        </button>
        <button id="read-instead" class="entry__read" type="button"></button>
        <p id="sound-notice" class="entry__notice"></p>
      </div>
    </div>

    <!-- ============================================================
         3D WORLD
         ============================================================ -->
    <canvas id="webgl" class="webgl" aria-hidden="true"></canvas>

    <!-- Drives ScrollTrigger. Its height is set from config in main.js. -->
    <div id="scroll-spacer" class="scroll-spacer" aria-hidden="true"></div>

    <!-- ============================================================
         2D DOCUMENT MODE — populated in src/ui/document2d.js
         ============================================================ -->
    <!-- Server-rendered from content.js at build time and replaced by
         document2d.js on load. It is here so that a crawler, a preview card
         and a visitor with JavaScript off all get the actual text. -->
    <main id="doc" class="doc" hidden><!--doc--></main>

    <!-- ============================================================
         PERSISTENT OVERLAY — populated in src/ui/overlay.js
         ============================================================ -->
    <div id="overlay" class="overlay" hidden></div>

    <!-- Screen-reader announcements for section changes -->
    <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

    <noscript>
      <style>
        /* No JavaScript: no gate, no world, no overlay — just the document,
           which is already in the HTML above. */
        #entry, #webgl, #scroll-spacer, #overlay { display: none !important; }
        #doc[hidden] { display: block !important; }
      </style>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
